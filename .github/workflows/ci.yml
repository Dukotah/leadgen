name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r gui/requirements.txt pytest
      - name: Run engine test suites
        run: pytest leadgen/tests -q
      - name: Run GUI end-to-end test (offline)
        run: python gui/test_gui.py
