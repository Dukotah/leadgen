<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="leadgen — free, no-key local-business lead generation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- pin mark -->
  <g transform="translate(96 160)">
    <circle r="54" fill="none" stroke="#28a745" stroke-width="6" opacity="0.9"/>
    <circle r="16" fill="#28a745"/>
    <circle cx="0" cy="-78" r="7" fill="#7cc6ff"/>
    <circle cx="70" cy="34" r="7" fill="#ffd166"/>
    <circle cx="-70" cy="34" r="7" fill="#ff7b86"/>
    <line x1="0" y1="-16" x2="0" y2="-71" stroke="#7cc6ff" stroke-width="3" opacity="0.6"/>
    <line x1="11" y1="11" x2="63" y2="30" stroke="#ffd166" stroke-width="3" opacity="0.6"/>
    <line x1="-11" y1="11" x2="-63" y2="30" stroke="#ff7b86" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- wordmark -->
  <text x="210" y="150" class="t" font-size="92" font-weight="800" fill="#ffffff">leadgen</text>
  <text x="214" y="200" class="t" font-size="30" font-weight="500" fill="#c8d6e5">Free, no-key local-business lead generation</text>

  <!-- stat pills -->
  <g class="t" font-size="22" font-weight="700">
    <g transform="translate(214 240)">
      <rect width="178" height="46" rx="23" fill="#1f4e78"/>
      <text x="89" y="30" text-anchor="middle" fill="#ffffff">19 verticals</text>
    </g>
    <g transform="translate(406 240)">
      <rect width="210" height="46" rx="23" fill="#1f4e78"/>
      <text x="105" y="30" text-anchor="middle" fill="#ffffff">10 data sources</text>
    </g>
    <g transform="translate(630 240)">
      <rect width="172" height="46" rx="23" fill="#28a745"/>
      <text x="86" y="30" text-anchor="middle" fill="#ffffff">0 API keys</text>
    </g>
    <g transform="translate(816 240)">
      <rect width="180" height="46" rx="23" fill="#1f4e78"/>
      <text x="90" y="30" text-anchor="middle" fill="#ffffff">CLI · GUI · app</text>
    </g>
  </g>

  <!-- tier chips, top-right -->
  <g class="t" font-size="20" font-weight="700" transform="translate(980 60)">
    <g><rect width="58" height="34" rx="8" fill="#28a745"/><text x="29" y="23" text-anchor="middle" fill="#04210f">A</text></g>
    <g transform="translate(68 0)"><rect width="58" height="34" rx="8" fill="#ffd166"/><text x="29" y="23" text-anchor="middle" fill="#3a2c00">B</text></g>
    <g transform="translate(136 0)"><rect width="58" height="34" rx="8" fill="#ff7b86"/><text x="29" y="23" text-anchor="middle" fill="#3a0008">C</text></g>
  </g>
</svg>
