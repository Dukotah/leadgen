; mypy.ini — type-check config for the leadgen package.
;
;     pip install mypy        # dev-only, not a project dependency
;     mypy leadgen
;
; Intentionally lenient to start: it surfaces real type errors without forcing
; full annotation of the existing code. Tighten over time (e.g. flip
; check_untyped_defs to True, then disallow_untyped_defs) as annotations land.

[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_unused_ignores = True
check_untyped_defs = False
warn_redundant_casts = True
warn_unused_configs = True

; Optional dependencies (duckdb, flask, openpyxl, etc.) may not be installed in
; every environment; ignore_missing_imports above already keeps those quiet.
